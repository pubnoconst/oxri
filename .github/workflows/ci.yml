name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A newer push to the same pull request (or branch) cancels the run it
# supersedes: a PR usually gets its code, then its rationale, a minute apart.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Check formatting (gofmt) and vet
        env:
          CGO_ENABLED: "0"
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:"; echo "$unformatted"; exit 1
          fi
          go vet ./...

      - name: Run unit & integration tests (CGO_ENABLED=0)
        env:
          CGO_ENABLED: "0"
        run: go test -v ./...

      - name: Setup Node (JavaScript type-check only)
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Type-check JavaScript (tsc --noEmit, strict JSDoc)
        run: |
          npm ci --no-audit --no-fund
          npx --no-install tsc -p .

      - name: Verify static Linux binary build (CGO_ENABLED=0)
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
        run: go build -trimpath -o bin/server ./cmd/server

  # Performance (BLUEPRINTS/PROFILING.md, HIG §1.6): the lab profile against
  # the site served in-process from an in-memory database with seeded content
  # (cmd/lab -local: no credentials, no real data, no calls to X). Fails only
  # on what is deterministic: a page's field report is incomplete, or a page
  # shifts (any run's CLS > 0.1). LCP and INP against Google's good lines are
  # reported in the job summary, not failed: on a shared runner they swing by
  # hundreds of milliseconds between runs. The table is kept as an artifact.
  performance:
    # Pull requests only: after a merge, main holds the tree the PR already
    # measured.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Chrome version
        run: google-chrome --version

      - name: Field report is complete on leaving each page (vitals.js)
        env:
          CGO_ENABLED: "0"
        run: go run ./cmd/lab -local -beacon -parallel 4

      - name: Lab profile on a budget phone (CLS gated; LCP and INP reported)
        env:
          CGO_ENABLED: "0"
        run: |
          mkdir -p bin
          go run ./cmd/lab -local -runs 3 -parallel 4 -budget -out bin/lab.md

      - name: Lab table in the job summary
        if: always()
        run: |
          if [ -f bin/lab.md ]; then cat bin/lab.md >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Keep the lab report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lab-report
          path: bin/lab.md
          if-no-files-found: ignore
