name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A newer push to the same pull request (or branch) cancels the run it
# supersedes: a PR usually gets its code, then its rationale, a minute apart.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Check formatting (gofmt) and vet
        env:
          CGO_ENABLED: "0"
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:"; echo "$unformatted"; exit 1
          fi
          go vet ./...

      - name: Run unit & integration tests (CGO_ENABLED=0)
        env:
          CGO_ENABLED: "0"
        run: go test -v ./...

      - name: Setup Node (JavaScript type-check only)
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Type-check JavaScript (tsc --noEmit, strict JSDoc, the site's scripts and the lab script)
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck

      - name: Verify static Linux binary build (CGO_ENABLED=0)
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
        run: go build -trimpath -o bin/server ./cmd/server

  # Performance (BLUEPRINTS/PROFILING.md, HIG §1.6): the lab profile against
  # the site served in-process from an in-memory database with seeded content
  # (cmd/lab -local: no credentials, no real data, no calls to X). Fails only
  # on what is deterministic: a page's field report is incomplete, or a page
  # shifts (any run's CLS > 0.1). LCP and INP against Google's good lines are
  # reported in the job summary, not failed: on a shared runner they swing by
  # hundreds of milliseconds between runs. The table is kept as an artifact.
  performance:
    # Pull requests only: after a merge, main holds the tree the PR already
    # measured.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Chrome version
        run: google-chrome --version

      # The lab script (cmd/lab/lab.mjs) is to replace the Go lab (RATIONALE
      # 091). Until the two have been compared on one build, both run here,
      # one after the other on the same runner, and both tables go to the
      # summary.
      - name: Setup Node (the lab script)
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Throwaway comparison (never merged): both labs on one runner, in a
      # balanced order, so run order and lab can be told apart.
      - name: Go lab, pass 1 of 2
        env:
          CGO_ENABLED: "0"
        run: |
          mkdir -p bin
          go run ./cmd/lab -local -runs 3 -parallel 4 -budget -out bin/go-1.md
      - name: Node lab, pass 1 of 2
        env:
          CGO_ENABLED: "0"
        run: |
          mkdir -p bin
          node cmd/lab/lab.mjs -local -runs 3 -parallel 4 -budget -out bin/node-1.md
      - name: Node lab, pass 2 of 2
        env:
          CGO_ENABLED: "0"
        run: |
          mkdir -p bin
          node cmd/lab/lab.mjs -local -runs 3 -parallel 4 -budget -out bin/node-2.md
      - name: Go lab, pass 2 of 2
        env:
          CGO_ENABLED: "0"
        run: |
          mkdir -p bin
          go run ./cmd/lab -local -runs 3 -parallel 4 -budget -out bin/go-2.md
      - name: Lab tables in the job summary
        if: always()
        run: |
          for f in bin/go-1.md bin/node-1.md bin/node-2.md bin/go-2.md; do
            if [ -f "$f" ]; then echo "## $f" >> "$GITHUB_STEP_SUMMARY"; tail -n +2 "$f" >> "$GITHUB_STEP_SUMMARY"; fi
          done

      - name: Keep the lab reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lab-report
          path: |
            bin/go-*.md
            bin/node-*.md
          if-no-files-found: ignore
