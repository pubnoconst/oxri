services:
  - type: web
    name: res-imperii
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: prod
      - key: TRUST_PROXY
        value: "true"
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: ADMIN_TOTP_SECRET
        sync: false
      - key: ADMIN_PASSWORD_HASH
        sync: false
