<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Catalog &amp; Newspaper Entry Reader — Res Imperii Lab</title>
  <style>
    @font-face {
      font-family: "Res Book";
      font-style: normal;
      font-weight: 400;
      font-display: swap;
      src: url("/fonts/eb-garamond-latin-400.woff2") format("woff2");
    }
    @font-face {
      font-family: "Res Book";
      font-style: italic;
      font-weight: 400;
      font-display: swap;
      src: url("/fonts/eb-garamond-latin-400-italic.woff2") format("woff2");
    }
    @font-face {
      font-family: "Res UI";
      font-style: normal;
      font-weight: 400;
      font-display: swap;
      src: url("/fonts/figtree-latin-400.woff2") format("woff2");
    }
    @font-face {
      font-family: "Res UI";
      font-style: normal;
      font-weight: 400;
      font-display: swap;
      src: url("/fonts/didact-gothic-greek-400.woff2") format("woff2");
      unicode-range: U+0370-03FF, U+1F00-1FFF;
    }
    @font-face {
      font-family: "Res Entry";
      font-style: normal;
      font-weight: 400;
      font-display: swap;
      src: url("/fonts/playpen-sans-latin-400.woff2") format("woff2");
    }
    @font-face {
      font-family: "Res Entry";
      font-style: normal;
      font-weight: 400;
      font-display: swap;
      src: url("/fonts/didact-gothic-greek-400.woff2") format("woff2");
      unicode-range: U+0370-03FF, U+1F00-1FFF;
    }
    @font-face {
      font-family: "Res Quote";
      font-style: normal;
      font-weight: 400;
      font-display: swap;
      src: url("/fonts/short-stack-latin-400.woff2") format("woff2");
    }
    @font-face {
      font-family: "Res Quote";
      font-style: normal;
      font-weight: 400;
      font-display: swap;
      src: url("/fonts/didact-gothic-greek-400.woff2") format("woff2");
      unicode-range: U+0370-03FF, U+1F00-1FFF;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      font-weight: 400;
      font-synthesis-weight: none;
    }

    :root {
      --font-serif: "Res Book", Georgia, serif;
      --font-ui: "Res UI", system-ui, sans-serif;
      --font-entry: "Res Entry", system-ui, sans-serif;
      --font-quote-active: "Res Quote", system-ui, sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;

      --page: #f5f4f0;
      --page-ink: #34332f;
      --accent-warn: #c98a2c;
      --accent-active: #3b6e44;
      --accent-danger: #c74e4a;

      --depth-sunk-surface: color-mix(in srgb, var(--page) 94%, var(--page-ink));
      --depth-0-surface: var(--page);
      --depth-1-surface: color-mix(in srgb, var(--page) 45%, #ffffff);
      --depth-1-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.6),
        0 1px 1px rgba(60, 55, 45, 0.05),
        0 8px 22px -10px rgba(60, 55, 45, 0.16),
        0 22px 44px -26px rgba(60, 55, 45, 0.18);
      --depth-2-surface: color-mix(in srgb, var(--page) 20%, #ffffff);
      --depth-2-shadow:
        0 1px 0 rgba(0, 0, 0, 0.04),
        0 6px 14px -10px rgba(40, 35, 25, 0.35);

      --glass-light: #f5f0e6;
      --glass-saturate: saturate(1.2);
      --depth-overlay-blur: blur(5px) var(--glass-saturate);

      --border-subtle: color-mix(in srgb, var(--page-ink) 11%, transparent);
      --border-card: color-mix(in srgb, var(--page-ink) 15%, transparent);
      --border-input: color-mix(in srgb, var(--page-ink) 20%, transparent);
      --border-focus: color-mix(in srgb, var(--page-ink) 45%, transparent);

      --radius-card: 0.5rem;
      --radius-control: 0.35rem;
      --radius-pill: 999px;

      --space-card-pad: 1.75rem;
      --space-card-pad-sm: 1.1rem;
      --interact-duration: 140ms;
      --ease-veil: 240ms cubic-bezier(0.22, 1, 0.36, 1);
    }

    :root[data-theme="dark"] {
      color-scheme: dark;
      --page: #0f1113;
      --page-ink: #d6d6d3;
      --accent-warn: #e6b450;
      --accent-active: #87b382;
      --accent-danger: #e06c68;
      --depth-1-surface: color-mix(in srgb, var(--page) 95.5%, #ffffff);
      --depth-1-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.035),
        0 1px 1px rgba(0, 0, 0, 0.35),
        0 10px 24px -8px rgba(0, 0, 0, 0.55),
        0 24px 48px -24px rgba(0, 0, 0, 0.6);
      --depth-2-surface: color-mix(in srgb, var(--page) 92%, #ffffff);
      --depth-2-shadow:
        0 1px 0 rgba(0, 0, 0, 0.3),
        0 6px 14px -8px rgba(0, 0, 0, 0.6);
    }

    :root[data-quote-font="ui"] { --font-quote-active: "Res UI", system-ui, sans-serif; }

    body {
      background: var(--depth-0-surface);
      color: var(--page-ink);
      font-family: var(--font-ui);
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
      padding: 0 0 5rem;
      transition: background-color 180ms ease, color 180ms ease;
    }

    .lab-bar {
      position: sticky;
      top: 0;
      z-index: 50;
      background: var(--depth-1-surface);
      border-bottom: 1px solid var(--border-card);
      padding: 0.68rem 1.4rem;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.65rem 1.15rem;
    }
    @supports (backdrop-filter: blur(1px)) {
      .lab-bar {
        background: color-mix(in srgb, var(--depth-1-surface) 80%, transparent);
        backdrop-filter: var(--depth-overlay-blur);
      }
    }

    .lab-title-group {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 0.65rem;
    }
    .lab-title {
      font-family: var(--font-serif);
      font-size: 1.18rem;
      letter-spacing: 0.02em;
    }
    .lab-sub {
      font-size: 0.76rem;
      color: color-mix(in srgb, var(--page-ink) 60%, transparent);
    }

    .lab-controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.45rem;
    }

    .seg-group {
      display: inline-flex;
      border: 1px solid var(--border-input);
      border-radius: var(--radius-control);
      overflow: hidden;
      background: var(--depth-0-surface);
    }
    .seg-btn {
      border: 0;
      background: transparent;
      padding: 0.26rem 0.58rem;
      font-size: 0.75rem;
      cursor: pointer;
      color: color-mix(in srgb, var(--page-ink) 70%, transparent);
      border-right: 1px solid var(--border-subtle);
      transition: background-color var(--interact-duration) ease, color var(--interact-duration) ease;
    }
    .seg-btn:last-child { border-right: 0; }
    .seg-btn:hover {
      color: var(--page-ink);
      background: color-mix(in srgb, var(--page-ink) 5%, transparent);
    }
    .seg-btn.is-on {
      background: var(--page-ink);
      color: var(--page);
    }

    .shell {
      width: min(74rem, 100%);
      margin: 0 auto;
      padding: 1.75rem 1.5rem 0;
    }
    body[data-viewport="mobile"] .shell {
      width: 400px;
      max-width: 100%;
    }

    .archive-summary {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem 1.25rem;
      padding: 0.82rem 1.05rem;
      margin-bottom: 1.5rem;
      border: 1px solid var(--border-card);
      border-radius: var(--radius-card);
      background: var(--depth-1-surface);
      font-size: 0.82rem;
    }
    .summary-counts {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.45rem 0.85rem;
      color: color-mix(in srgb, var(--page-ink) 75%, transparent);
    }
    .count-chip {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      padding: 0.1rem 0.45rem;
      border-radius: var(--radius-pill);
      border: 1px solid var(--border-subtle);
      background: var(--depth-sunk-surface);
    }

    /* =====================================================================
       CATALOG GRID & PREVIEW CARDS
       ===================================================================== */
    .catalog-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 1.35rem;
      align-items: start;
    }
    @media (max-width: 980px) {
      .catalog-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 640px) {
      .catalog-grid { grid-template-columns: 1fr; }
    }
    body[data-viewport="mobile"] .catalog-grid {
      grid-template-columns: 1fr;
    }

    .u-journal-card {
      position: relative;
      padding: var(--space-card-pad-sm);
      border: 1px solid var(--border-card);
      border-radius: var(--radius-card);
      background: var(--depth-1-surface);
      box-shadow: var(--depth-1-shadow);
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
      cursor: pointer;
      transition: border-color var(--interact-duration) ease;
    }
    .u-journal-card:hover,
    .u-journal-card:focus-within {
      border-color: var(--border-focus);
    }
    .u-journal-card.is-draft {
      border-style: dashed;
      border-color: var(--border-input);
    }

    /* =====================================================================
       UNIVERSAL TWEET CLIPPING (.u-tweet)
       ===================================================================== */
    .u-tweet {
      width: 100%;
      padding: 0.88rem 0.98rem;
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-card);
      background: var(--depth-2-surface);
      box-shadow: var(--depth-2-shadow);
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
      text-align: left;
    }

    .u-tweet-author-row {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      min-width: 0;
    }
    .u-avatar {
      width: 2.2rem;
      height: 2.2rem;
      flex: 0 0 2.2rem;
      border-radius: 50%;
      object-fit: cover;
      background: var(--depth-sunk-surface);
      border: 1px solid var(--border-subtle);
    }
    .u-avatar-fallback {
      width: 2.2rem;
      height: 2.2rem;
      flex: 0 0 2.2rem;
      border-radius: 50%;
      background: var(--depth-sunk-surface);
      border: 1px solid var(--border-subtle);
      display: grid;
      place-items: center;
      font-size: 0.82rem;
      color: color-mix(in srgb, var(--page-ink) 65%, transparent);
    }
    .u-identity {
      display: flex;
      flex-direction: column;
      min-width: 0;
      line-height: 1.22;
    }
    .u-name {
      font-family: var(--font-ui);
      font-size: 0.9rem;
      color: var(--page-ink);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .u-handle {
      font-family: var(--font-ui);
      font-size: 0.76rem;
      color: color-mix(in srgb, var(--page-ink) 56%, transparent);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .u-ext {
      margin-left: auto;
      align-self: flex-start;
      font-family: var(--font-ui);
      font-size: 0.74rem;
      color: color-mix(in srgb, var(--page-ink) 42%, transparent);
      text-decoration: none;
      padding: 0.05rem 0.2rem;
      transition: color var(--interact-duration) ease;
    }
    .u-ext:hover { color: var(--page-ink); }

    .u-statement-body {
      font-family: var(--font-quote-active);
      font-size: 0.94rem;
      line-height: 1.5;
      color: color-mix(in srgb, var(--page-ink) 92%, var(--depth-2-surface));
      white-space: pre-line;
      overflow-wrap: anywhere;
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 6;
      overflow: hidden;
    }

    .u-snippet-row {
      display: grid;
      grid-template-columns: 4.85rem minmax(0, 1fr);
      gap: 0.78rem;
      align-items: start;
    }
    .u-snippet-thumb-wrap {
      position: relative;
      width: 4.85rem;
      height: 4.85rem;
      border-radius: var(--radius-control);
      overflow: hidden;
      border: 1px solid var(--border-subtle);
      background: var(--depth-sunk-surface);
      flex-shrink: 0;
    }
    .u-snippet-thumb-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .u-snippet-count {
      position: absolute;
      right: 0.25rem;
      bottom: 0.25rem;
      padding: 0.05rem 0.32rem;
      font-family: var(--font-mono);
      font-size: 0.65rem;
      border-radius: var(--radius-control);
      background: rgba(15, 17, 19, 0.74);
      color: #f5f4f0;
    }
    .u-snippet-row .u-statement-body {
      font-size: 0.88rem;
      line-height: 1.46;
      -webkit-line-clamp: 5;
    }

    .u-quoted-box {
      padding: 0.5rem 0.68rem;
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-control);
      background: var(--depth-sunk-surface);
      font-size: 0.8rem;
      line-height: 1.42;
    }
    .u-quoted-head {
      display: flex;
      gap: 0.35rem;
      margin-bottom: 0.2rem;
      font-family: var(--font-ui);
      font-size: 0.75rem;
    }
    .u-quoted-text {
      font-family: var(--font-quote-active);
      white-space: pre-line;
    }

    /* 1C Full-Bleed Caption Overlay */
    .u-tweet.is-caption {
      padding: 0;
      gap: 0;
      overflow: hidden;
      position: relative;
      outline: none;
    }
    .u-tweet.is-caption:focus-visible {
      outline: 2px solid var(--border-focus);
      outline-offset: 2px;
    }
    .u-caption-stage {
      position: relative;
      width: 100%;
      overflow: hidden;
      background: var(--depth-sunk-surface);
    }
    .u-caption-stage img.u-stage-photo {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .u-tweet.is-caption .u-tweet-author-row {
      position: absolute;
      top: 0.58rem;
      left: 0.58rem;
      z-index: 3;
      padding: 0.3rem 0.58rem 0.3rem 0.34rem;
      border-radius: var(--radius-pill);
      background: rgba(15, 17, 19, 0.62);
      border: 1px solid rgba(245, 240, 230, 0.16);
      backdrop-filter: blur(6px) saturate(1.2);
      width: fit-content;
      max-width: calc(100% - 1.16rem);
      opacity: 0;
      transform: translateY(-4px);
      pointer-events: none;
      transition: opacity var(--ease-veil), transform var(--ease-veil);
    }
    .u-tweet.is-caption .u-avatar,
    .u-tweet.is-caption .u-avatar-fallback {
      width: 1.72rem;
      height: 1.72rem;
      flex-basis: 1.72rem;
    }
    .u-tweet.is-caption .u-name { color: #f5f4f0; font-size: 0.82rem; }
    .u-tweet.is-caption .u-handle { color: rgba(245, 244, 240, 0.74); font-size: 0.7rem; }
    .u-tweet.is-caption .u-ext { color: rgba(245, 244, 240, 0.72); margin-left: 0.25rem; align-self: center; }

    .u-caption-overlay {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 2;
      padding: 1.9rem 0.85rem 0.7rem;
      background: linear-gradient(
        to top,
        rgba(12, 13, 15, 0.86) 0%,
        rgba(12, 13, 15, 0.54) 58%,
        rgba(12, 13, 15, 0) 100%
      );
      color: #f5f4f0;
      font-family: var(--font-quote-active);
      font-size: 0.88rem;
      line-height: 1.4;
      opacity: 0;
      transform: translateY(4px);
      pointer-events: none;
      transition: opacity var(--ease-veil), transform var(--ease-veil);
    }

    .u-tweet.is-caption:hover .u-tweet-author-row,
    .u-tweet.is-caption:focus .u-tweet-author-row,
    .u-tweet.is-caption:focus-within .u-tweet-author-row,
    .u-tweet.is-caption.is-touch-focused .u-tweet-author-row,
    .u-tweet.is-caption:hover .u-caption-overlay,
    .u-tweet.is-caption:focus .u-caption-overlay,
    .u-tweet.is-caption:focus-within .u-caption-overlay,
    .u-tweet.is-caption.is-touch-focused .u-caption-overlay {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    .u-play-badge {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 2.75rem;
      height: 2.75rem;
      border-radius: 50%;
      background: rgba(15, 17, 19, 0.62);
      transform: translate(-50%, -50%);
      display: grid;
      place-items: center;
      z-index: 2;
    }
    .u-play-badge.is-sm { width: 1.65rem; height: 1.65rem; }
    .u-play-tri {
      width: 0;
      height: 0;
      border-top: 0.48rem solid transparent;
      border-bottom: 0.48rem solid transparent;
      border-left: 0.78rem solid #f5f4f0;
      margin-left: 0.16rem;
    }
    .u-play-badge.is-sm .u-play-tri {
      border-top-width: 0.32rem;
      border-bottom-width: 0.32rem;
      border-left-width: 0.52rem;
      margin-left: 0.1rem;
    }

    .u-passage {
      width: 100%;
      padding: 0.88rem 0.98rem;
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-card);
      background: var(--depth-2-surface);
      box-shadow: var(--depth-2-shadow);
      display: flex;
      flex-direction: column;
      gap: 0.55rem;
      text-align: left;
    }
    .u-passage-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 0.5rem;
    }
    .u-passage-ref { font-family: var(--font-ui); font-size: 0.9rem; color: var(--page-ink); }
    .u-passage-ver { font-family: var(--font-mono); font-size: 0.7rem; color: color-mix(in srgb, var(--page-ink) 54%, transparent); }

    .u-still-frame {
      position: relative;
      width: 100%;
      border-radius: var(--radius-card);
      overflow: hidden;
      border: 1px solid var(--border-subtle);
      background: var(--depth-2-surface);
      box-shadow: var(--depth-2-shadow);
      max-height: 14rem;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .u-still-frame img {
      width: 100%;
      max-height: 14rem;
      object-fit: cover;
      display: block;
    }

    .u-link-slip {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      padding: 0.58rem 0.8rem;
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-card);
      background: var(--depth-2-surface);
      font-size: 0.8rem;
      color: color-mix(in srgb, var(--page-ink) 75%, transparent);
      text-decoration: none;
    }

    .u-entry-excerpt {
      font-family: var(--font-entry);
      font-size: 0.95rem;
      line-height: 1.54;
      color: color-mix(in srgb, var(--page-ink) 90%, transparent);
      text-align: left;
      white-space: pre-line;
      overflow-wrap: anywhere;
    }

    .u-card-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      padding-top: 0.1rem;
      font-family: var(--font-ui);
      font-size: 0.75rem;
      color: color-mix(in srgb, var(--page-ink) 54%, transparent);
    }
    .u-foot-left { display: flex; align-items: center; flex-wrap: wrap; gap: 0.36rem; min-width: 0; }
    .u-dot-sep::before { content: "·"; }
    .u-foot-tag { color: color-mix(in srgb, var(--page-ink) 68%, transparent); }
    .u-foot-right { display: flex; align-items: center; gap: 0.42rem; flex-shrink: 0; }
    .u-star { color: var(--accent-warn); font-size: 0.82rem; }
    .u-draft-label { font-size: 0.71rem; color: color-mix(in srgb, var(--page-ink) 56%, transparent); }

    /* =====================================================================
       CLICKED FULL JOURNAL ENTRY — NEWSPAPER VIEW (/journals/{id})
       ===================================================================== */
    .entry-reader-wrap {
      width: min(56rem, 100%);
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 1.1rem;
    }

    .entry-reader-nav {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
    }
    .back-btn {
      border: 0;
      background: none;
      padding: 0;
      font-family: var(--font-ui);
      font-size: 0.92rem;
      color: color-mix(in srgb, var(--page-ink) 65%, transparent);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      transition: color var(--interact-duration) ease;
    }
    .back-btn:hover { color: var(--page-ink); text-decoration: underline; }

    .stepper-group {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
    }
    .step-btn {
      padding: 0.25rem 0.62rem;
      border: 1px solid var(--border-card);
      border-radius: var(--radius-control);
      background: var(--depth-1-surface);
      font-size: 0.78rem;
      cursor: pointer;
      transition: border-color var(--interact-duration) ease;
    }
    .step-btn:hover:not(:disabled) { border-color: var(--border-focus); }
    .step-btn:disabled { opacity: 0.42; cursor: not-allowed; }

    .layout-reason-pill {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      padding: 0.18rem 0.58rem;
      border-radius: var(--radius-pill);
      border: 1px solid var(--border-card);
      background: var(--depth-1-surface);
      color: color-mix(in srgb, var(--page-ink) 72%, transparent);
    }

    .entry-sheet {
      padding: var(--space-card-pad);
      border: 1px solid var(--border-card);
      border-radius: var(--radius-card);
      background: var(--depth-1-surface);
      box-shadow: var(--depth-1-shadow);
      display: flex;
      flex-direction: column;
      gap: 1.35rem;
    }
    .entry-sheet.is-draft {
      border-style: dashed;
      border-color: var(--border-input);
    }

    .entry-newspaper-stage {
      display: flow-root;
    }

    .entry-sheet .u-statement-body {
      display: block;
      -webkit-line-clamp: unset;
      overflow: visible;
      font-size: 0.96rem;
      line-height: 1.56;
    }

    /* Mode 1: Standard Newspaper Top-Left Float (wrap-left) */
    .entry-sheet.is-wrap-left .entry-source-box {
      float: left;
      width: clamp(15.5rem, 43%, 22.5rem);
      margin: 0.15rem 1.75rem 1.15rem 0;
    }
    .entry-sheet.is-wrap-left .u-still-frame,
    .entry-sheet.is-wrap-left .u-still-frame img {
      max-height: 20rem;
    }

    /* Mode 2 (NEW RULE D — Coexisting Compressed Source + Early Code):
       When the source is short (<= 140 chars, no media) and the author introduces
       a code block early, pair the compressed top-left source slip (~29% width)
       beside the opening prose + <pre><code> column (~71% width) in a stretched
       two-column band so the source card's height matches the bottom of the code
       block and its contents sit centred vertically inside the card, while any
       subsequent prose wraps across the full 100% width below! */
    .entry-compact-diptych {
      display: grid;
      grid-template-columns: clamp(12.5rem, 29%, 15.25rem) minmax(0, 1fr);
      gap: 1.35rem;
      align-items: stretch;
    }
    .entry-compact-diptych > .entry-source-box {
      display: flex;
      min-width: 0;
    }
    .entry-compact-diptych .u-tweet,
    .entry-compact-diptych .u-passage {
      flex: 1;
      height: 100%;
      justify-content: center;
      padding: 0.85rem 0.92rem;
      gap: 0.55rem;
    }
    .entry-compact-diptych .u-avatar,
    .entry-compact-diptych .u-avatar-fallback {
      width: 1.85rem;
      height: 1.85rem;
      flex-basis: 1.85rem;
    }
    .entry-compact-diptych .u-name { font-size: 0.84rem; }
    .entry-compact-diptych .u-handle { font-size: 0.71rem; }
    .entry-compact-diptych .u-statement-body {
      font-size: 0.87rem;
      line-height: 1.46;
    }
    .entry-compact-diptych .entry-diptych-right {
      min-width: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .entry-compact-diptych .entry-diptych-right > pre {
      clear: none;
    }
    .entry-compact-diptych .entry-diptych-right > :last-child {
      margin-bottom: 0;
    }
    .entry-diptych-tail {
      margin-top: 1.1rem;
    }

    /* Mode 3: Stacked Source at Top, Commentary Starting at Bottom
       (Used when source is media + rich >80c description, OR when an early code
       block meets a long/media-heavy source that cannot compress cleanly) */
    .entry-sheet.is-stack-bottom .entry-source-box {
      float: none;
      width: 100%;
      margin: 0 0 1.45rem 0;
    }
    .entry-sheet.is-stack-bottom .u-snippet-row {
      grid-template-columns: minmax(11rem, 38%) minmax(0, 1fr);
      gap: 1.15rem;
    }
    .entry-sheet.is-stack-bottom .u-snippet-thumb-wrap {
      width: 100%;
      height: auto;
      aspect-ratio: 4 / 3;
    }

    /* Mobile / narrow screens gracefully release floats and diptych */
    @media (max-width: 680px) {
      .entry-sheet.is-wrap-left .entry-source-box {
        float: none;
        width: 100%;
        margin: 0 0 1.25rem 0;
      }
      .entry-compact-diptych {
        grid-template-columns: 1fr;
      }
      .entry-sheet.is-stack-bottom .u-snippet-row {
        grid-template-columns: 1fr;
      }
    }
    body[data-viewport="mobile"] .entry-sheet.is-wrap-left .entry-source-box {
      float: none;
      width: 100%;
      margin: 0 0 1.25rem 0;
    }
    body[data-viewport="mobile"] .entry-compact-diptych {
      grid-template-columns: 1fr;
    }
    body[data-viewport="mobile"] .entry-sheet.is-stack-bottom .u-snippet-row {
      grid-template-columns: 1fr;
    }

    /* Author's Full Commentary Prose */
    .entry-prose {
      font-family: var(--font-entry);
      font-size: 1.08rem;
      line-height: 1.72;
      color: color-mix(in srgb, var(--page-ink) 94%, transparent);
      overflow-wrap: anywhere;
    }
    .entry-prose p,
    .entry-prose ul,
    .entry-prose ol,
    .entry-prose blockquote,
    .entry-prose pre {
      margin: 0 0 1rem;
    }
    .entry-prose > :last-child {
      margin-bottom: 0;
    }
    .entry-prose h1,
    .entry-prose h2,
    .entry-prose h3 {
      margin: 0 0 0.65rem;
      line-height: 1.25;
    }
    .entry-prose h1 { font-size: 1.55rem; }
    .entry-prose h2 { font-size: 1.32rem; }
    .entry-prose h3 { font-size: 1.15rem; }
    .entry-prose strong, .entry-prose b {
      font-variant-caps: all-small-caps;
      letter-spacing: 0.04em;
    }
    .entry-prose em, .entry-prose i {
      font-style: italic;
    }
    .entry-prose blockquote {
      font-family: var(--font-quote-active);
      padding-left: 0.95rem;
      border-left: 2px solid var(--border-input);
      color: color-mix(in srgb, var(--page-ink) 80%, transparent);
    }
    .entry-prose pre {
      clear: left;
      overflow-x: auto;
      padding: 0.88rem 1rem;
      border-radius: var(--radius-control);
      border: 1px solid var(--border-subtle);
      background: var(--depth-sunk-surface);
      font-family: var(--font-mono);
      font-size: 0.84rem;
      line-height: 1.55;
    }
    .entry-prose code {
      font-family: var(--font-mono);
      font-size: 0.88em;
    }

    .entry-sheet-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      padding-top: 0.85rem;
      border-top: 1px solid var(--border-subtle);
      font-family: var(--font-ui);
      font-size: 0.8rem;
      color: color-mix(in srgb, var(--page-ink) 58%, transparent);
    }

    .specimens-list {
      width: min(56rem, 100%);
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 2.5rem;
    }
    .specimen-header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: baseline;
      gap: 0.5rem;
      margin-bottom: 0.55rem;
      padding-bottom: 0.35rem;
      border-bottom: 1px solid var(--border-subtle);
    }
    .specimen-header h3 {
      font-size: 1.02rem;
    }
  </style>
</head>
<body data-screen="specimens" data-filter="all" data-viewport="desktop">

  <header class="lab-bar">
    <div class="lab-title-group">
      <span class="lab-title">Res Imperii · Catalog &amp; Newspaper Entry Lab</span>
      <span class="lab-sub">Updated Rule D: Short Quote Compresses Beside Code</span>
    </div>
    <div class="lab-controls">
      <div class="seg-group" aria-label="Screen">
        <button class="seg-btn" data-set-screen="catalog">Catalog (13 Real)</button>
        <button class="seg-btn" data-set-screen="entry">Entry Reader</button>
        <button class="seg-btn is-on" data-set-screen="specimens">Rule Specimens (See D1 &amp; D2)</button>
      </div>
      <div class="seg-group" id="filter-group" style="display:none;" aria-label="Filter entries">
        <button class="seg-btn is-on" data-set-filter="all">All</button>
        <button class="seg-btn" data-set-filter="published">Published</button>
        <button class="seg-btn" data-set-filter="tweets">Tweets Only</button>
      </div>
      <div class="seg-group" aria-label="Quote typeface">
        <button class="seg-btn is-on" data-set-font="quote">Quote Face</button>
        <button class="seg-btn" data-set-font="ui">Clean Sans</button>
      </div>
      <div class="seg-group" aria-label="Viewport">
        <button class="seg-btn is-on" data-set-vp="desktop">Desktop</button>
        <button class="seg-btn" data-set-vp="mobile">Phone</button>
      </div>
      <div class="seg-group" aria-label="Theme">
        <button class="seg-btn is-on" data-set-theme="light">Light</button>
        <button class="seg-btn" data-set-theme="dark">Dark</button>
      </div>
    </div>
  </header>

  <main class="shell">
    <section class="archive-summary" id="summary-bar" style="display:none;">
      <div class="summary-counts" id="summary-counts">Loading real archive from Turso (read-only)…</div>
      <div id="summary-hint" style="font-size:0.76rem; color:color-mix(in srgb, var(--page-ink) 60%, transparent);">
        Click any card to inspect its full Newspaper Entry layout.
      </div>
    </section>

    <div id="view-mount"></div>
  </main>

  <script>
    let allEntries = [];
    let activeEntryIndex = 0;
    let touchObserver = null;

    function esc(s) {
      const d = document.createElement("div");
      d.textContent = s == null ? "" : String(s);
      return d.innerHTML;
    }

    function clampRatio(w, h) {
      if (!w || !h || w <= 0 || h <= 0) return "4 / 3";
      const r = w / h;
      if (r < 0.85) return "85 / 100";
      if (r > 1.85) return "185 / 100";
      return w + " / " + h;
    }

    function renderAvatar(tw) {
      if (tw.avatarUrl) {
        return `<img class="u-avatar" src="${esc(tw.avatarUrl)}" alt="" loading="lazy" decoding="async">`;
      }
      const initial = (tw.name || tw.handle || "X").slice(0, 1).toUpperCase();
      return `<span class="u-avatar-fallback">${esc(initial)}</span>`;
    }

    function renderAuthorRow(tw) {
      return `
        <div class="u-tweet-author-row">
          ${renderAvatar(tw)}
          <div class="u-identity">
            <span class="u-name">${esc(tw.name)}</span>
            <span class="u-handle">@${esc(tw.handle)}</span>
          </div>
          <a class="u-ext" href="${esc(tw.postUrl)}" target="_blank" rel="noopener noreferrer" title="View on X" onclick="event.stopPropagation()">↗</a>
        </div>
      `;
    }

    function renderQuoted(q) {
      if (!q || !q.text) return "";
      return `
        <div class="u-quoted-box">
          <div class="u-quoted-head">
            <span class="u-name" style="font-size:0.75rem">${esc(q.name)}</span>
            <span class="u-handle" style="font-size:0.72rem">@${esc(q.handle)}</span>
          </div>
          <div class="u-quoted-text">${esc(q.text)}</div>
        </div>
      `;
    }

    function renderUniversalTweet(tw, isFullEntry) {
      if (tw.archetype === "caption") {
        const m = tw.media[0];
        const imgSrc = (isFullEntry && m.medUrl) ? m.medUrl : m.url;
        const ratio = clampRatio(m.w, m.h);
        const playMark = m.kind === "video"
          ? `<span class="u-play-badge"><span class="u-play-tri"></span></span>`
          : "";
        const multiCount = tw.media.length > 1
          ? `<span class="u-snippet-count">1/${tw.media.length}</span>`
          : "";
        const captionOverlay = tw.text
          ? `<figcaption class="u-caption-overlay">${esc(tw.text)}</figcaption>`
          : "";
        return `
          <figure class="u-tweet is-caption" tabindex="0">
            ${renderAuthorRow(tw)}
            <div class="u-caption-stage" style="aspect-ratio: ${ratio}">
              <img class="u-stage-photo" src="${esc(imgSrc)}" alt="" loading="lazy" decoding="async">
              ${playMark}
              ${multiCount}
              ${captionOverlay}
            </div>
          </figure>
        `;
      }

      if (tw.archetype === "snippet") {
        const m = tw.media[0];
        const imgSrc = (isFullEntry && m.medUrl) ? m.medUrl : m.url;
        const playMark = m.kind === "video"
          ? `<span class="u-play-badge is-sm"><span class="u-play-tri"></span></span>`
          : "";
        const multiCount = tw.media.length > 1
          ? `<span class="u-snippet-count">1/${tw.media.length}</span>`
          : "";
        return `
          <figure class="u-tweet is-snippet">
            ${renderAuthorRow(tw)}
            <div class="u-snippet-row">
              <div class="u-snippet-thumb-wrap">
                <img src="${esc(imgSrc)}" alt="" loading="lazy" decoding="async">
                ${playMark}
                ${multiCount}
              </div>
              <blockquote class="u-statement-body">${esc(tw.text)}</blockquote>
            </div>
            ${renderQuoted(tw.quoted)}
          </figure>
        `;
      }

      return `
        <figure class="u-tweet is-statement">
          ${renderAuthorRow(tw)}
          ${tw.text ? `<blockquote class="u-statement-body">${esc(tw.text)}</blockquote>` : ""}
          ${renderQuoted(tw.quoted)}
        </figure>
      `;
    }

    function renderSourceBlock(entry, isFullEntry) {
      if (entry.tweet) {
        return renderUniversalTweet(entry.tweet, isFullEntry);
      }
      if (entry.passage) {
        return `
          <figure class="u-passage">
            <div class="u-passage-head">
              <span class="u-passage-ref">${esc(entry.passage.ref)}</span>
              <span class="u-passage-ver">${esc(entry.passage.ver)}</span>
            </div>
            <blockquote class="u-statement-body">${esc(entry.passage.text)}</blockquote>
          </figure>
        `;
      }
      if (entry.thumb) {
        const play = (entry.thumb.kind === "video" || entry.thumb.kind === "gif")
          ? `<span class="u-play-badge"><span class="u-play-tri"></span></span>`
          : "";
        return `
          <div class="u-still-frame">
            <img src="${esc(entry.thumb.url)}" alt="" loading="lazy" decoding="async">
            ${play}
          </div>
        `;
      }
      if (entry.mediaUrl) {
        const label = entry.mediaHost || entry.mediaUrl;
        return `
          <a class="u-link-slip" href="${esc(entry.mediaUrl)}" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation()">
            <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${esc(label)}</span>
            <span>↗</span>
          </a>
        `;
      }
      return "";
    }

    function renderCatalogCard(entry, idx) {
      const draftCls = entry.published ? "" : " is-draft";
      const tagsHTML = (entry.tags || []).map((t) => `<span class="u-dot-sep"></span><span class="u-foot-tag">${esc(t)}</span>`).join("");
      const rightBadges = [
        !entry.published ? `<span class="u-draft-label">Draft</span>` : "",
        entry.bookmarked ? `<span class="u-star" title="Bookmarked">★</span>` : ""
      ].filter(Boolean).join("");

      return `
        <article class="u-journal-card${draftCls}" data-open-idx="${idx}" tabindex="0" role="link" aria-label="Open entry from ${esc(entry.date)}">
          ${renderSourceBlock(entry, false)}
          ${entry.excerpt ? `<p class="u-entry-excerpt">${esc(entry.excerpt)}</p>` : ""}
          <footer class="u-card-foot">
            <div class="u-foot-left">
              <time>${esc(entry.date)}</time>
              ${tagsHTML}
            </div>
            <div class="u-foot-right">${rightBadges}</div>
          </footer>
        </article>
      `;
    }

    function layoutExplanation(mode) {
      switch (mode) {
        case "wrap-left":
          return "Layout: Newspaper Float (source top-left · commentary right, wrapping full-width below)";
        case "wrap-compact-code":
          return "Layout: Compressed Side-by-Side (short quote ~29% left · code & prose ~71% right, wrapping below)";
        case "stack-rich-source":
          return "Layout: Stacked Below (source has media + rich >80c description)";
        case "stack-early-code":
          return "Layout: Stacked Below (long/media source + early code block)";
        default:
          return "Layout: Pure Prose (no source media)";
      }
    }

    function splitAtFirstPre(htmlStr) {
      if (!htmlStr) return { head: "", tail: "" };
      const lower = htmlStr.toLowerCase();
      const closeIdx = lower.indexOf("</pre>");
      if (closeIdx < 0) return { head: htmlStr, tail: "" };
      const cut = closeIdx + "</pre>".length;
      return {
        head: htmlStr.slice(0, cut),
        tail: htmlStr.slice(cut).trim()
      };
    }

    function renderEntrySheet(entry) {
      const mode = entry.entryLayout || "wrap-left";
      let sheetModeCls = "";
      if (mode === "stack-rich-source" || mode === "stack-early-code") {
        sheetModeCls = " is-stack-bottom";
      } else if (mode === "wrap-compact-code") {
        sheetModeCls = " is-wrap-compact";
      } else if (mode === "wrap-left") {
        sheetModeCls = " is-wrap-left";
      }
      const draftCls = entry.published ? "" : " is-draft";
      const sourceHTML = renderSourceBlock(entry, true);
      const tagsHTML = (entry.tags || []).map((t) => `<span class="u-dot-sep"></span><span class="u-foot-tag">${esc(t)}</span>`).join("");
      const rightBadges = [
        !entry.published ? `<span class="u-draft-label">Draft</span>` : "",
        entry.bookmarked ? `<span class="u-star" title="Bookmarked">★</span>` : ""
      ].filter(Boolean).join("");

      let stageInner = "";
      if (mode === "wrap-compact-code" && sourceHTML) {
        const parts = splitAtFirstPre(entry.renderedHtml || "");
        stageInner = `
          <div class="entry-compact-diptych">
            <div class="entry-source-box">${sourceHTML}</div>
            <div class="entry-prose entry-diptych-right">${parts.head}</div>
          </div>
          ${parts.tail ? `<div class="entry-prose entry-diptych-tail">${parts.tail}</div>` : ""}
        `;
      } else {
        stageInner = `
          ${sourceHTML ? `<div class="entry-source-box">${sourceHTML}</div>` : ""}
          ${entry.renderedHtml ? `<div class="entry-prose">${entry.renderedHtml}</div>` : ""}
        `;
      }

      return `
        <article class="entry-sheet${sheetModeCls}${draftCls}">
          <div class="entry-newspaper-stage">
            ${stageInner}
          </div>
          <footer class="entry-sheet-foot">
            <div class="u-foot-left">
              <time>${esc(entry.date)}</time>
              ${tagsHTML}
            </div>
            <div class="u-foot-right">${rightBadges}</div>
          </footer>
        </article>
      `;
    }

    function makeSpecimenArt(kind) {
      const c = document.createElement("canvas");
      c.width = 560;
      c.height = 380;
      const g = c.getContext("2d");
      if (kind === "oculus") {
        const bg = g.createLinearGradient(0, 0, 560, 380);
        bg.addColorStop(0, "#2c2721");
        bg.addColorStop(1, "#171512");
        g.fillStyle = bg;
        g.fillRect(0, 0, 560, 380);
        const beam = g.createLinearGradient(160, 0, 440, 380);
        beam.addColorStop(0, "rgba(255, 244, 218, 0.72)");
        beam.addColorStop(1, "rgba(245, 224, 182, 0.03)");
        g.fillStyle = beam;
        g.beginPath();
        g.moveTo(140, 0); g.lineTo(240, 0); g.lineTo(510, 380); g.lineTo(310, 380);
        g.closePath(); g.fill();
      } else {
        g.fillStyle = "#dfd5c0";
        g.fillRect(0, 0, 560, 380);
        g.fillStyle = "#8f4638";
        g.fillRect(54, 48, 92, 92);
        g.fillStyle = "#453e34";
        for (let y = 52; y < 330; y += 20) {
          const x = y < 156 ? 168 : 54;
          g.fillRect(x, y, 452 - x - ((y * 13) % 45), 7);
        }
      }
      return c.toDataURL("image/png");
    }

    function buildSpecimens() {
      const imgOculus = makeSpecimenArt("oculus");
      const imgFolio = makeSpecimenArt("folio");
      return [
        {
          title: "Rule D1 (Updated) · Short Quote (≤140c) Compresses Top-Left Beside Early Code",
          badge: "wrap-compact-code (~29% compressed quote left · ~71% code & prose right · wraps 100% below)",
          entry: {
            date: "Nov 27, 2026",
            published: true,
            bookmarked: true,
            tags: ["Types", "Go"],
            entryLayout: "wrap-compact-code",
            tweet: {
              name: "Alexis King",
              handle: "lexi_lambda",
              postUrl: "#0",
              archetype: "statement",
              charCount: 74,
              text: "Parse, don't validate: make illegal states unrepresentable at the boundary."
            },
            renderedHtml: `
              <p>An unexported capability struct makes forgetting the session check a compile error:</p>
              <pre><code>type AdminCap struct {
    minted bool // only internal/auth can mint
}

func (s *Store) Create(
    ctx context.Context,
    cap domain.AdminCap,
    in ValidatedEntry,
) (int64, error)</code></pre>
              <p>Because the quoted tweet is concise (&le; 140 characters, no media), compressing its slip to ~29% lets the tweet and the code block <strong>coexist in one horizontal space</strong>—and once the prose clears both, it naturally takes the full reading measure below.</p>
            `
          }
        },
        {
          title: "Rule D2 · Opening Immediately With Code (Zero Lead-In Prose) Beside Short Quote",
          badge: "wrap-compact-code (Axiom on left · implementation directly aligned on right)",
          entry: {
            date: "Nov 26, 2026",
            published: false,
            bookmarked: false,
            tags: ["Invariant", "SQL"],
            entryLayout: "wrap-compact-code",
            tweet: {
              name: "Rob Pike",
              handle: "rob_pike",
              postUrl: "#0",
              archetype: "statement",
              charCount: 49,
              text: "Data dominates. Choose the right representations."
            },
            renderedHtml: `
              <pre><code>CHECK (
  (tag1 IS NULL OR tag2 IS NULL OR tag1 != tag2) AND
  (tag1 IS NULL OR tag3 IS NULL OR tag1 != tag3)
)</code></pre>
              <p>Even when the very first line of your entry is a fenced code block, the compressed quote card and the code block align cleanly on the same top horizon, with your prose commentary flowing across the full width underneath.</p>
            `
          }
        },
        {
          title: "Rule D3 · Fallback: Long Quote (>140c) + Early Code → Commentary Starts Below",
          badge: "stack-early-code (Quote too long to squeeze to 29% -> drops cleanly below)",
          entry: {
            date: "Nov 25, 2026",
            published: true,
            bookmarked: false,
            tags: ["Architecture"],
            entryLayout: "stack-early-code",
            tweet: {
              name: "Martin Kleppmann",
              handle: "martinkl",
              postUrl: "#0",
              archetype: "statement",
              charCount: 238,
              text: "When state lives in two places without a deterministic single writer or monotonic watermark, every network retry or process restart eventually invents a split-brain bug that unit tests never saw coming."
            },
            renderedHtml: `
              <p>Monotonic TOTP replay watermark persisted inside a single transaction:</p>
              <pre><code>UPDATE auth_state SET value_int = MAX(value_int, ?), updated_at = ? WHERE key = 'totp_last_step';</code></pre>
              <p>Here the tweet is 238 characters—squeezing it into a narrow 29% strip would create a tall, cramped column, so only long/media quotes drop the early code block to the bottom.</p>
            `
          }
        },
        {
          title: "Rule A & B · Standard Newspaper Wrap (Quote or 1C Media Top-Left, Essay Wraps Below)",
          badge: "wrap-left (43% source top-left · prose right, expanding to 100% below)",
          entry: {
            date: "Nov 24, 2026",
            published: true,
            bookmarked: false,
            tags: ["Architecture", "Rome"],
            entryLayout: "wrap-left",
            tweet: {
              name: "Classical Forms",
              handle: "forma_perennis",
              postUrl: "#0",
              archetype: "caption",
              charCount: 48,
              text: "Geometry made audible in stone. Rome, 6:40 a.m.",
              media: [{ kind: "photo", url: imgOculus, medUrl: imgOculus, w: 560, h: 380 }]
            },
            renderedHtml: `
              <p>Without early code blocks, the source takes a comfortable 43% top-left frame. Hovering the photograph eases in the author pill and caption.</p>
              <p>Your commentary begins at top-right beside the frame and wraps cleanly across the full width below once the photograph ends, keeping image and prose in quiet proportion.</p>
            `
          }
        },
        {
          title: "Rule C · Media + Rich Description (>80c) → Commentary Starts at Bottom",
          badge: "stack-rich-source (Media + >80c statement takes top; commentary starts below)",
          entry: {
            date: "Nov 23, 2026",
            published: true,
            bookmarked: true,
            tags: ["History", "Print"],
            entryLayout: "stack-rich-source",
            tweet: {
              name: "Bodleian Manuscripts",
              handle: "bodleian_mss",
              postUrl: "#0",
              archetype: "snippet",
              charCount: 192,
              text: "Thirteenth-century glossators laid commentary around the central text in deliberate, quiet proportions: the source already pairs illumination on the left with extensive exposition on the right.",
              media: [{ kind: "photo", url: imgFolio, medUrl: imgFolio, w: 560, h: 380 }]
            },
            renderedHtml: `
              <p>Because the quoted source itself already combines <strong>media and a rich description</strong> (&gt; 80 characters), the source takes the full top of the sheet and your commentary starts cleanly here at the bottom.</p>
            `
          }
        }
      ];
    }

    function wireTouchFocusObserver() {
      if (touchObserver) {
        touchObserver.disconnect();
        touchObserver = null;
      }
      const cards = document.querySelectorAll(".u-tweet.is-caption");
      cards.forEach((el) => el.classList.remove("is-touch-focused"));

      const isTouchSim = document.body.dataset.viewport === "mobile" ||
                         window.matchMedia("(hover: none), (pointer: coarse)").matches;
      if (!isTouchSim) return;

      touchObserver = new IntersectionObserver((entries) => {
        entries.forEach((io) => {
          io.target.classList.toggle("is-touch-focused", io.isIntersecting);
        });
      }, {
        rootMargin: "-22% 0px -22% 0px",
        threshold: 0.55
      });

      cards.forEach((el) => touchObserver.observe(el));
    }

    function setScreenButton(screen) {
      document.body.dataset.screen = screen;
      document.querySelectorAll("[data-set-screen]").forEach((b) => {
        b.classList.toggle("is-on", b.getAttribute("data-set-screen") === screen);
      });
      document.getElementById("filter-group").style.display = screen === "catalog" ? "inline-flex" : "none";
      document.getElementById("summary-bar").style.display = screen === "catalog" ? "flex" : "none";
    }

    function getFilteredEntries() {
      const filter = document.body.dataset.filter;
      return allEntries.filter((e) => {
        if (filter === "published" && !e.published) return false;
        if (filter === "tweets" && !e.tweet) return false;
        return true;
      });
    }

    function render() {
      const screen = document.body.dataset.screen;
      const mount = document.getElementById("view-mount");
      const filtered = getFilteredEntries();

      if (screen === "catalog") {
        let nWrap = 0, nRich = 0, nCompactCode = 0, nStackCode = 0;
        filtered.forEach((e) => {
          if (e.entryLayout === "stack-rich-source") nRich++;
          else if (e.entryLayout === "wrap-compact-code") nCompactCode++;
          else if (e.entryLayout === "stack-early-code") nStackCode++;
          else nWrap++;
        });
        document.getElementById("summary-counts").innerHTML = `
          <span><strong>${filtered.length}</strong> real entries</span>
          <span class="count-chip">Newspaper Wrap: ${nWrap}</span>
          <span class="count-chip">Compact Quote+Code: ${nCompactCode}</span>
          <span class="count-chip">Stack (Rich Media): ${nRich}</span>
          <span class="count-chip">Stack (Long+Code): ${nStackCode}</span>
        `;

        mount.className = "catalog-grid";
        mount.innerHTML = filtered.map((e, idx) => renderCatalogCard(e, idx)).join("");

        mount.querySelectorAll("[data-open-idx]").forEach((card) => {
          const openIt = () => {
            activeEntryIndex = parseInt(card.getAttribute("data-open-idx"), 10) || 0;
            setScreenButton("entry");
            render();
            window.scrollTo({ top: 0, behavior: "instant" });
          };
          card.addEventListener("click", openIt);
          card.addEventListener("keydown", (ev) => {
            if (ev.key === "Enter" || ev.key === " ") {
              ev.preventDefault();
              openIt();
            }
          });
        });
      } else if (screen === "entry") {
        mount.className = "";
        const list = filtered.length ? filtered : allEntries;
        if (!list.length) {
          mount.innerHTML = `<p style="text-align:center;padding:2rem;">No entries loaded.</p>`;
          return;
        }
        if (activeEntryIndex >= list.length) activeEntryIndex = 0;
        const entry = list[activeEntryIndex];

        mount.innerHTML = `
          <div class="entry-reader-wrap">
            <div class="entry-reader-nav">
              <button type="button" class="back-btn" id="back-to-catalog">‹ Journals</button>
              <span class="layout-reason-pill">${esc(layoutExplanation(entry.entryLayout))}</span>
              <div class="stepper-group">
                <button type="button" class="step-btn" id="prev-entry" ${activeEntryIndex === 0 ? "disabled" : ""}>← Newer</button>
                <span style="font-family:var(--font-mono);font-size:0.75rem;opacity:0.65;">${activeEntryIndex + 1} / ${list.length}</span>
                <button type="button" class="step-btn" id="next-entry" ${activeEntryIndex >= list.length - 1 ? "disabled" : ""}>Older →</button>
              </div>
            </div>
            ${renderEntrySheet(entry)}
          </div>
        `;

        document.getElementById("back-to-catalog").addEventListener("click", () => {
          setScreenButton("catalog");
          render();
        });
        document.getElementById("prev-entry").addEventListener("click", () => {
          if (activeEntryIndex > 0) { activeEntryIndex--; render(); }
        });
        document.getElementById("next-entry").addEventListener("click", () => {
          if (activeEntryIndex < list.length - 1) { activeEntryIndex++; render(); }
        });
      } else if (screen === "specimens") {
        mount.className = "";
        const specs = buildSpecimens();
        mount.innerHTML = `
          <div class="specimens-list">
            ${specs.map((sp) => `
              <section>
                <div class="specimen-header">
                  <h3>${esc(sp.title)}</h3>
                  <span class="layout-reason-pill">${esc(sp.badge)}</span>
                </div>
                ${renderEntrySheet(sp.entry)}
              </section>
            `).join("")}
          </div>
        `;
      }

      wireTouchFocusObserver();
    }

    function bindGroup(attr, apply) {
      const buttons = document.querySelectorAll("[" + attr + "]");
      buttons.forEach((btn) => {
        btn.addEventListener("click", () => {
          buttons.forEach((b) => b.classList.remove("is-on"));
          btn.classList.add("is-on");
          apply(btn.getAttribute(attr));
        });
      });
    }

    bindGroup("data-set-screen", (v) => { setScreenButton(v); render(); });
    bindGroup("data-set-filter", (v) => { document.body.dataset.filter = v; activeEntryIndex = 0; render(); });
    bindGroup("data-set-font", (v) => {
      if (v === "quote") document.documentElement.removeAttribute("data-quote-font");
      else document.documentElement.dataset.quoteFont = v;
    });
    bindGroup("data-set-vp", (v) => {
      document.body.dataset.viewport = v;
      wireTouchFocusObserver();
    });
    bindGroup("data-set-theme", (v) => { document.documentElement.dataset.theme = v; });

    document.addEventListener("dblclick", (e) => {
      if (e.target.closest("button, a, input, figure, article, pre")) return;
      const next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
      document.documentElement.dataset.theme = next;
      document.querySelectorAll("[data-set-theme]").forEach((b) => {
        b.classList.toggle("is-on", b.getAttribute("data-set-theme") === next);
      });
    });

    // Render specimens immediately, then enrich catalog once API responds
    render();
    fetch("/api/entries")
      .then((r) => r.json())
      .then((data) => {
        allEntries = data.entries || [];
        render();
      })
      .catch((err) => {
        document.getElementById("summary-counts").textContent = "Error loading archive: " + err.message;
      });
  </script>
</body>
</html>
